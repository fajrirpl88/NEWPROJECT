<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website dengan Custom CSS & Bootstrap</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
      :root {
        --warna-utama: #101828;
        --warna-kedua: #393939;
        --warna-ketiga: #FF5A09;
      }

      body {
        background-color: var(--warna-utama);
        font-family: "Ubuntu", sans-serif;
        color: #ffffff;
      }

      .custom-navbar {
        background-color: var(--warna-kedua) !important;
      }

      .btn-custom {
        color: var(--warna-ketiga);
        border-color: var(--warna-ketiga);
      }

      .btn-custom:hover {
        background-color: var(--warna-ketiga);
        color: #fff;
      }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg custom-navbar" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Navbar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Link</a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link" href="#"></a>
            </li>
            <li class="nav-item">
              <a class="nav-link disabled" aria-disabled="true">Disabled</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Hero Section -->
    <section id="hero" class="py-5">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-lg-5 offset-lg-1">
            <h1 class="fw-bold display-4 mb-3"> SMK SETIA BHAKTI </h1>
            <p class="lead mb-4">Deskripsi singkat di dalam hero section untuk menarik perhatian pengunjung website. </p>
            <a href="#" class="btn btn-custom btn-lg">LANJUT UNTUK MELIHAT</a>
          </div>
          <!-- Kolom kanan opsional untuk gambar atau ilustrasi -->
          <div class="col-lg-5">
            <!-- Tempat gambar/ilustrasi jika ada -->
          </div>
        </div>
      </div>
    </section>

    <!-- Content Utama -->
    <div class="container mt-4">
        <h1>Project Saya</h1>
        <p>Halaman ini sekarang menggunakan warna <strong>Ubuntu</strong> dengan warna hitam untuk menggambarkannya <code>#101828</code>.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
